function compactPlans(){return state.plans.map((p,i)=>`<div class="list-item"><div class="letter">${String.fromCharCode(65+i%26)}</div><div class="list-info"><h3>${E(p.name)}</h3><p>${p.exercises.length} exercícios · ${p.exercises.reduce((n,e)=>n+e.sets,0)} séries · ~${plannedMinutes(p)} min</p></div>${btn(I('arrow'),'start',p.id,'outline small-button',`aria-label="Iniciar ${E(p.name)}"`)}</div>`).join('')}
function home(){const next=D.nextPlan(state),last=state.history.slice().sort((a,b)=>b.ended-a.ended)[0],stats=D.weeklyStats(state),suggestions=state.plans.flatMap(p=>p.exercises.map(e=>({e,s:D.progression(state,e)}))).filter(x=>x.s.eligible),todayIndex=(new Date().getDay()+6)%7;const restToday=state.schedule[todayIndex]==='rest';return `${heading('SEU TREINO APRENDE COM VOCÊ',state.profile.name?`Bom treino, ${state.profile.name.split(' ')[0]}.`:'Encontre o seu ritmo.','Planeje com intenção. Registre com facilidade. Evolua com clareza.',`<span class="pill outline">${I('target')} ${E(state.profile.goal)} · ${state.profile.weeklyGoal} dias</span>`)}${statsCards()}<div class="main-grid"><div><section class="hero"><span class="eyebrow">${state.session?'SEU TREINO ESTÁ EM ANDAMENTO':restToday?'HOJE ESTÁ MARCADO COMO DESCANSO':'PRÓXIMO TREINO'}</span><h2>${E(state.session?.name||next?.name||'Monte sua primeira ficha')}</h2><p>${state.session?'Seus registros estão salvos. Continue de onde parou.':next?`${next.exercises.length} exercícios · Cerca de ${plannedMinutes(next)} min · ${restToday?'Você pode escolher treinar ou manter o descanso.':'No seu tempo, no seu ritmo.'}`:'Organize os exercícios definidos para você.'}</p><div class="actions">${state.session?btn('Retomar treino '+I('arrow'),'resume','','primary'):next?btn('Iniciar treino '+I('arrow'),'start',next.id,'primary'):btn('Criar ficha '+I('plus'),'new-plan','','primary')}${btn('Ver minhas fichas','show-plans','','outline')}</div></section><div class="section-heading"><h2>Sua semana, no seu ritmo</h2>${btn('Planejar','schedule','','ghost small-button')}</div>${weekStrip()}<div class="section-heading"><h2>Suas fichas</h2>${btn(I('plus')+' Nova ficha','new-plan','','outline small-button')}</div><div class="card">${state.plans.length?compactPlans():empty('Crie sua primeira ficha de treino.')}</div><div class="section-heading"><h2>O próximo passo</h2><span class="pill">Progressão revisável</span></div><div class="card">${suggestions.length?suggestions.slice(0,3).map(({e,s})=>`<div class="insight"><h3>${E(e.name)} · ${N(s.previous)} → ${N(s.weight)} kg</h3><p>${E(s.reason)} O incremento de ${N(s.increment)} kg está configurado na sua ficha.</p></div>`).join(''):`<div class="row"><div><h3>Construa sua linha de base.</h3><p class="desc">As sugestões aparecem quando todas as séries anteriores atingem o topo da faixa de repetições com a mesma carga. Nada é aumentado automaticamente.</p></div>${I('progresso')}</div>`}</div></div><aside class="rail"><section class="card"><span class="eyebrow muted">CONSTÂNCIA DA SEMANA</span><div class="goal-number">${stats.sessions}<small> de ${state.profile.weeklyGoal} treinos</small></div><div class="progress-track"><span style="width:${stats.consistency}%"></span></div><p class="desc">${stats.sessions>=state.profile.weeklyGoal?'Sua meta semanal foi alcançada.':`Faltam ${Math.max(0,state.profile.weeklyGoal-stats.sessions)} treinos para sua meta atual.`}</p></section><section class="card"><div class="card-title"><h3>Seu último treino</h3>${I('clock')}</div>${last?`<p class="eyebrow muted">${E(date(last.ended))}</p><h3 style="margin:11px 0">${E(last.name)}</h3><p class="mini-note">${last.sets} séries · ${N(D.volume(last))} kg de volume · ${last.minutes} min</p>${btn('Abrir histórico','show-history','','outline small-button','style="margin-top:17px"')}`:`<p class="mini-note">Quando concluir uma sessão, ela aparece aqui com suas cargas e repetições.</p>`}</section><section class="card"><div class="card-title"><h3>Movimento além da ficha</h3>${I('heart')}</div><div class="goal-number">${N(stats.cardioMinutes)}<small> / ${state.profile.cardioTarget} min eq.</small></div><div class="progress-track"><span style="width:${state.profile.cardioTarget?Math.min(100,stats.cardioMinutes/state.profile.cardioTarget*100):0}%"></span></div><p class="desc">Minutos moderados + 2 × minutos vigorosos registrados nesta semana.</p>${btn('Registrar cardio','cardio','','outline sm function training(){if(state.session)return workout();return `${heading('ORGANIZE SEU PRÓXIMO PASSO','Seu treino. Do seu jeito.','Fichas, exercícios e planejamento em um só lugar.',btn(I('plus')+' Nova ficha','new-plan','','dark'))}<div class="subtabs"><button data-action="training-tab" data-value="fichas" class="${trainingTab==='fichas'?'active':''}">Minhas fichas</button><button data-action="training-tab" data-value="biblioteca" class="${trainingTab==='biblioteca'?'active':''}">Biblioteca</button><button data-action="training-tab" data-value="semana" class="${trainingTab==='semana'?'active':''}">Planejamento</button></div>${trainingTab==='biblioteca'?libraryView():trainingTab==='semana'?scheduleView():plansView()}`}
function plansView(){return `<div class="two-cols">${state.plans.map((p,i)=>`<article class="card plan-card"><div class="row"><div class="tag-row"><span class="letter">${String.fromCharCode(65+i%26)}</span><h3>${E(p.name)}</h3></div>${btn('Editar','edit-plan',p.id,'outline small-button')}</div><p class="plan-meta">${p.exercises.length} exercícios · ${p.exercises.reduce((n,e)=>n+e.sets,0)} séries · ~${plannedMinutes(p)} min</p>${p.exercises.map((e,j)=>`<div class="plan-exercise"><span class="order">${j+1}</span><div style="flex:1"><div class="name">${E(e.name)}</div><div class="meta">${E(D.info(e.name).primary)} · ${e.sets} × ${e.repsMin}–${e.repsMax} reps · ${e.rest}s descanso</div></div>${videoMapping(e.name)?`<span class="pill" title="Demonstração disponível">${I('play')}</span>`:''}</div>`).join('')}<div class="actions mt">${btn('Iniciar treino '+I('arrow'),'start',p.id,'primary')}${btn('Duplicar','duplicate-plan',p.id,'outline small-button')}${btn('Excluir','delete-plan',p.id,'ghost small-button')}</div></article>`).join('')||empty('Crie uma ficha para começar.')}</div><p class="mini-note mt">As fichas de exemplo são editáveis. Uma carga em halteres representa o peso por halter; em máquinas, mantenha o mesmo critério e equipamento entre sessões.</p>`}
function scheduleView(){return `<section class="card"><div class="card-title"><div><h2>Uma semana com intenção.</h2><p class="desc">Trocar o dia de uma ficha não altera as outras nem o seu histórico.</p></div>${I('calendar')}</div><div class="schedule-grid">${['Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'].map((day,i)=>`<div class="schedule-item"><label for="schedule-${i}">${day}</label><select id="schedule-${i}" data-schedule="${i}">${options([['rest','Descanso'],...state.plans.map(p=>[p.id,p.name])],state.schedule[i])}</select></div>`).join('')}</div><p class="mini-note mt">Sua meta atual é ${state.profile.weeklyGoal} treinos por semana. A programação acima é uma organização pessoal, não uma prescrição automática.</p></section><div class="section-heading"><h2>O que você já fez nesta semana</h2></div>${weekStrip()}`}
function libraryView(){const custom=[...new Set(state.plans.flatMap(p=>p.exercises.map(e=>e.name)))].filter(name=>!D.CATALOG.some(e=>e.name===D.exerciseName(name))).map(D.info),all=[...D.CATALOG,...custom],groups=[...new Set([...all.map(e=>e.primary),'Cardio'])].sort(),query=librarySearch;const filtered=all.filter(e=>(!libraryGroup||e.primary===libraryGroup)&&D.matchesExercise(e,query));const cardio=(!libraryGroup||libraryGroup==='Cardio')?D.CARDIO_ACTIVITIES.filter(name=>D.searchKey(name+' Cardio '+(name==='Escada'?'Stair Climber':'')).includes(D.searchKey(query))):[];return `<div class="search-row"><input id="library-search" placeholder="Buscar exercício, músculo ou equipamento" aria-label="Buscar exercícios" value="${E(librarySearch)}"><select id="library-group" aria-label="Filtrar grupo muscular">${options([['','Todos os grupos'],...groups.map(g=>[g,g])],libraryGroup)}</select></div><p class="mini-note mb">${filtered.length} exercícios de musculação · ${cardio.length} atividades de cardio · Vídeos incluídos onde disponíveis. Exercícios personalizados mantêm seus registros.</p><div class="catalog-grid">${filtered.map(e=>`<article class="card catalog-card"><div class="row"><div class="catalog-icon">${I('treino')}</div><span class="pill ${videoMapping(e.name)?'lime':''}">${videoMapping(e.name)?'Com vídeo':'Vídeo pendente'}</span></div><h3>${E(e.name)}</h3><p>${E(e.primary)} · ${E(e.equipment)}</p><div class="actions">${btn('Conhecer exercício','exercise-info',e.name,'outline small-button')}${btn(videoMapping(e.name)?I('play')+' Ver execução':'+ Adicionar vídeo','video',e.name,videoMapping(e.name)?'primary small-button':'outline small-button')}</div></article>`).join('')||(!cardio.length?empty('Nenhum exercício encontrado. Altere o filtro ou crie um exercício na sua ficha.'):'')}</div>${cardio.length?`<section class="card mt"><h2>Cardio</h2><p class="mini-note mb">Registre duração, distância e intensidade.</p>${cardio.map(name=>`<div class="alternative"><h3>${E(name function workout(){const s=state.session,done=s.exercises.reduce((n,e)=>n+e.sets.filter(x=>x.done).length,0),total=s.exercises.reduce((n,e)=>n+e.sets.length,0);return `${heading('TREINO DO DIA','Um movimento de cada vez.','Confira o registro anterior, ajuste o necessário e marque sua série.',btn('Descartar','discard','','ghost small-button'))}<section class="session-summary"><div class="row"><div><h2>${E(s.name)}</h2><p class="mini-note" style="margin-top:5px">${done} de ${total} séries concluídas · Iniciado às ${new Date(s.started).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</p></div>${btn('Concluir treino ✓','finish','','primary',done?'':'disabled')}</div><div class="progress-track"><span style="width:${total?done/total*100:0}%"></span></div></section><div class="main-grid"><div>${s.exercises.map((e,i)=>exerciseCard(e,i)).join('')}</div><aside class="rail"><section class="card"><div class="card-title"><h3>Seu foco hoje</h3>${I('target')}</div><p class="mini-note">${E(state.profile.goal)} · ${E(state.profile.effortMetric)} por série</p><div class="goal-number">${N(D.volume(s))}<small> kg registrados</small></div><p class="mini-note">Volume = carga × repetições das séries concluídas. Em halteres, mantenha o registro por halter.</p></section><section class="card"><h3>Esforço, com suas palavras.</h3><p class="desc">${state.profile.effortMetric==='RIR'?'RIR é a estimativa de quantas repetições você ainda conseguiria fazer ao terminar a série. Por exemplo: 2 significa cerca de duas repetições em reserva.':'RPE é sua percepção de esforço de 1 a 10. Registre a percepção da série, sem precisar calcular uma carga a partir dela.'}</p><p class="mini-note mt">O campo é opcional. Nenhum valor é inferido automaticamente nem convertido entre RIR e RPE.</p></section><section class="callout"><b>Sem pressa entre as séries.</b><p>Ao concluir uma série, o descanso configurado para o exercício começa automaticamente. Você pode pausar, somar 30 segundos ou pular.</p></section></aside></div>`}
function exerciseCard(e,i){const previous=D.lastExercise(state,e.name),suggestion=D.progression(state,e),meta=D.info(e.name),metric=e.metric||state.profile.effortMetric;return `<article class="card exercise-card" data-exercise="${i}"><div class="exercise-heading"><div><h3>${E(e.name)}</h3><p class="group">${E(meta.primary)} · ${E(meta.equipment)}${e.originalName?` · Substitui ${E(e.originalName)}`:''}</p></div><span class="pill">${i+1}/${state.session.exercises.length}</span></div><div class="exercise-actions">${btn(videoMapping(e.name)?I('play')+' Ver execução':'+ Adicionar vídeo','video',e.name,videoMapping(e.name)?'primary':'outline')}${btn(I('swap')+' Substituir','substitute',String(i),'outline',e.sets.some(x=>x.done)?'disabled title="Substitua antes de concluir as séries deste exercício"':'')}${btn('Detalhes','exercise-info',e.name,'outline')}</div><div class="exercise-settings"><span>Meta: <b>${e.repsMin}–${e.repsMax} repetições</b></span><label>Descanso: <select class="rest-select" aria-label="Descanso de ${E(e.name)}" data-rest="${i}">${options([...new Set([0,30,60,90,120,150,180,240,300,e.rest])].sort((a,b)=>a-b).map(x=>[x,x+' s']),e.rest)}</select></label><span>${previous?'Anterior: '+date(previous.ended):'Primeiro registro deste exercício'}</span></div><div class="set-grid set-labels"><span>Série</span><span>Anterior<br>kg × reps</span><span>${D.isAssisted(e.name)?'Assist. · kg':'Hoje · kg'}</span><span>Reps</span><span>${metric}</span><span>Feita</span></div>${e.sets.map((set,j)=>{const p=D.previousSet(previous,j,e.sets);return `<div class="set-grid set-row ${set.done?'complete':''}"><span class="set-number">${j+1}</span><span class="previous">${p?`${N(p.weight)} × ${p.reps}`:'—'}</span><input type="number" inputmode="decimal" min="0" max="2000" step="0.25" value="${set.weight}" aria-label="${D.isAssisted(e.name)?'Assistência':'Carga'}, ${E(e.name)}, série ${j+1}" data-set="${i}:${j}:weight"><input type="number" inputmode="numeric" min="1" max="1000" ste function lineChart(points,value,label,unit=''){if(!points.length)return empty('Ainda não há registros suficientes para este gráfico.');const width=600,height=205,pad={l:48,r:22,t:20,b:35},max=Math.max(1,...points.map(x=>Number(x[value])||0)),nice=Math.ceil(max/4)*4,plotW=width-pad.l-pad.r,plotH=height-pad.t-pad.b;const x=i=>pad.l+(points.length===1?plotW/2:i*plotW/(points.length-1)),y=v=>pad.t+plotH-(v/nice*plotH);const path=points.map((p,i)=>`${i?'L':'M'}${x(i)},${y(p[value])}`).join(' ');return `<svg class="chart" viewBox="0 0 ${width} ${height}" role="img" aria-label="${E(label)}">${[0,1,2,3,4].map(i=>`<path class="axis" d="M${pad.l},${y(i*nice/4)} H${width-pad.r}"/><text x="${pad.l-8}" y="${y(i*nice/4)+4}" text-anchor="end">${N(i*nice/4)}</text>`).join('')}<path class="area" d="${path} L${x(points.length-1)},${height-pad.b} L${x(0)},${height-pad.b} Z"/><path class="line" d="${path}"/>${points.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p[value])}" r="4"><title>${E(p.label)}: ${N(p[value])} ${E(unit)}</title></circle>${points.length<10?`<text x="${x(i)}" y="${height-10}" text-anchor="middle">${E(p.label)}</text>`:''}`).join('')}</svg><p class="mini-note">${E(label)}${unit?' · '+E(unit):''}. Passe o cursor pelos pontos para ver os valores.</p>`}
function muscleMap(){const groups=D.weeklyStats(state).groups,rows=Object.entries(groups).sort((a,b)=>b[1]-a[1]),max=Math.max(1,...rows.map(x=>x[1]));return rows.length?`${rows.map(([name,total])=>`<div class="muscle-row"><span>${E(name)}</span><div class="progress-track"><span style="width:${total/max*100}%"></span></div><strong>${total}</strong></div>`).join('')}<p class="mini-note mt">Séries concluídas por grupo principal, nesta semana. Músculos secundários não são somados novamente. A distribuição não indica uma meta individual ideal.</p>`:empty('Conclua séries para visualizar a distribuição por grupo muscular.')}
function progress(){const sorted=state.history.slice().sort((a,b)=>a.ended-b.ended),names=[...new Set(sorted.flatMap(h=>h.exercises.map(e=>e.name)))],series=D.weeklySeries(state),selected=names.includes(chartExercise)?chartExercise:names[0]||chartExercise;chartExercise=selected;const records=D.records(state,selected),points=sorted.flatMap(h=>{const found=h.exercises.filter(e=>e.name===selected).flatMap(e=>e.sets.filter(D.working));return found.length?[{label:date(h.ended),weight:(D.isAssisted(selected)?Math.min:Math.max)(...found.map(s=>s.weight))}]:[]}).slice(-10);return `${heading('REGISTROS QUE VIRAM DIREÇÃO','Veja o caminho que você construiu.','Compare sessões equivalentes e acompanhe suas próprias marcas.',btn(I('download')+' Exportar','export','','outline small-button'))}${statsCards()}<div class="subtabs">${[['visao','Visão geral'],['historico','Histórico'],['cardio','Cardio e medidas']].map(([v,t])=>btn(t,'progress-tab',v,progressTab===v?'active':'')).join('')}</div>${progressTab==='historico'?historyView():progressTab==='cardio'?activityView():`<div class="two-cols"><section class="card"><div class="card-title"><div><h3>Volume de treino</h3><p class="desc">Suas últimas oito semanas</p></div><span class="pill">kg × reps</span></div>${state.history.length?lineChart(series,'volume','Volume semanal registrado','kg'):empty('Seu gráfico começa com o primeiro treino concluído.')}</section><section class="card"><div class="card-title"><div><h3>Frequência semanal</h3><p class="desc">Sessões concluídas</p></div><span class="pill">Meta: ${state.profile.weeklyGoal}</span></div>${state.history.length?lineChart(series,'sessions','Treinos por semana','sessões'):empty('Registre sessões para acompanhar sua frequência.')}</section><section class="card"><div class="card-title"><h3>Carga por exercício</h3><select class="chart-select" id="chart-exercise" aria-label="Exercício do gráfico">${options((names.length?names:[selected]),selected)}</select></div>${lineChart(points,'weight',D.isAssisted(selected)?'Menor assistência registrada por sessão':'Maior carga concluída por sessão','kg')}<p class="mini-note mt">O gráfico compara apenas exercícios com o mesmo nome. Trocas de equipamento ou variação precisam ser registradas separadamente.</p></section><section class="card"><div class="card-title"><h3>Mapa de volume muscular</h3><span class="pill">Séries diretas</span></div>${muscleMap()}</section></div><section class="card mt"><div class="card-title"><div><h3>Suas marcas · ${E(selected)}</h3><p class="desc">Um histórico pessoal, não uma competição com outras pessoas.</p></div></div><div class="record-grid">${[['Maior carga',records.maxWeight,'kg'],['Mais repetições',records.maxReps,'reps'],['Volume em uma sessão',records.maxVolume,'kg'],['1RM estimada',records.e1rm,'kg']].map(([label,value,unit])=>`<div class="record-cell"><span>${label}</span><strong>${value?N(value):'—'} <small>${value?unit:''}</small></strong></div>`).join('')}</div><p class="mini-note mt">${D.isAssisted(selected)?'A carga deste exercício representa assistência. Volume em kg, recordes de carga e 1RM não são calculados para ele.':'1RM é apenas uma estimativa pela fórmula carga × (1 + repetições / 30), usando séries de 1 a 10 repetições. Não é uma medição nem uma indicação para testar carga máxima. Repetições e volume podem ter sido obtidos com cargas diferentes.'}</p></section>`}`}
function historyView(){const rows=state.history.slice().sort((a,b)=>b.ended-a.ended);return rows.length?rows.map(h=>{const prs=h.exercises.filter(e=>D.records(state,e.name).events.some(x=>x.ended===h.ended));return `<article class="card history-card"><div class="row"><div><span class="eyebrow muted">${E(stamp(h.ended))}</span><h3 style="margin-top:7px">${E(h.name)}</h3></div>${prs.length?`<span class="badge-pr">${prs.length} nova(s) marca(s)</span>`:''}</div><p class="mini-note" style="margin-top:9px">${h.sets} séries · ${N(D.volume(h))} kg de volume · ${h.minutes} min</p><details><summary>Ver séries e observações</summary>${h.exercises.map(e=>`<div class="history-exercise"><b>${E(e.name)}</b><div>${e.sets.map((s,i)=>s.done?`S${i+1}: ${N(s.weight)} kg × ${s.reps}${s.effort!==null&&s.effort!==undefined?' · '+(e.metric||'RIR')+' '+N(s.effort):''}`:`S${i+1}: não concluída`).join('<br>')}</div>${e.notes?`<p class="muted">${E(e.notes)}</p>`:''}</div>`).join('')}</details></article>`}).join(''):empty('Seu histórico ainda está vazio. Conclua uma sessão para guardar cada série.')}
function activityView(){const points=state.measurements.filter(m=>m.weight>0).slice().sort((a,b)=>a.ended-b.ended).slice(-12).map(m=>({label:date(m.ended),weight:m.weight}));return `<div class="two-cols"><section class="card"><div class="card-title"><h3>Cardio registrado</h3>${btn('+ Registrar','cardio','','primary small-button')}</div>${state.cardio.length?state.cardio.slice().sort((a,b)=>b.ended-a.ended).slice(0,10).map(c=>`<div class="list-item"><div class="catalog-icon" style="margin:0">${I('heart')}</div><div class="list-info"><h3>${E(c.type)} · ${N(c.minutes)} min</h3><p>${date(c.ended)} · ${E(c.intensity)}${c.distance?' · '+N(c.distance)+' km':''}${c.heartRate?' · '+c.heartRate+' bpm':''}</p></div>${btn('×','delete-cardio',c.id,'ghost',`aria-label="Excluir registro de ${E(c.type)}"`)}</div>`).join(''):empty('Caminhada, corrida, bicicleta, escada ou elíptico. Registre a atividade que você fez.')}<p class="mini-note mt">Para acompanhar a referência semanal de adultos: minutos moderados + duas vezes os minutos vigorosos. Atividade leve é registrada, mas não entra nessa equivalência. <a href="https://www.who.int/publications/i/item/9789240015128" target="_blank" rel="noopener noreferrer">Referência da OMS</a>.</p></section><section class="card"><div class="card-title"><h3>Peso corporal</h3>${btn('+ Medida','measure','','primary small-button')}</div>${lineChart(points,'weight','Peso informado ao longo do tempo','kg')}<p class="mini-note mt">Valores inseridos por você. Nenhuma estimativa automática de gordura corporal.</p></section></div><section class="card mt"><div class="card-title"><h3>Histórico de medidas</h3>${btn('Adicionar medidas','measure','','outline small-button')}</div>${state.measurements.length?`<div class="table-scroll"><table class="data-table"><thead><tr><th>Data</th><th>Peso</th><th>Cintura</th><th>Tórax</th><th>Braço</th><th>Coxa</th><th>Quadril</th><th>Gordura informada</th><th></th></tr></thead><tbody>${state.measurements.slice().sort((a,b)=>b.ended-a.ended).map(m=>`<tr><td>${date(m.ended)}</td>${['weight','waist','chest','arm','thigh','hip','fat'].map(k=>`<td>${m[k]?N(m[k])+(k==='weight'?' kg':k==='fat'?'%':' cm'):'—'}</td>`).join('')}<td>${btn('×','delete-measure',m.id,'ghost',`aria-label="Excluir medida de ${date(m.ended)}"`)}</td></tr>`).join('')}</tbody></table></div>`:empty('Adicione uma medida para construir seu histórico.')}</section>`}
function coach(){return `${heading('INFORMAÇÃO PARA O SEU PRÓXIMO PASSO','Coach, com os pés no chão.','Uma leitura dos seus registros para ajudar a organizar a rotina.')}<div class="main-grid"><div><section class="coach-intro"><span class="pill">${I('coach')} Análise local do histórico</span><h2>Seu treino conta uma história.<br>Vamos olhar os registros.</h2><p>Esta versão usa regras transparentes e os dados deste navegador. Ela não é uma IA conversacional conectada, não determina causas de estagnação e não faz diagnóstico.</p></section><div class="prompt-grid">${[['semana','Como está minha semana?','calendar'],['volume','Como estão os grupos musculares?','treino'],['progressao','Onde posso revisar a carga?','progresso'],['curto','Adaptar uma ficha ao meu tempo','clock']].map(([v,t,i])=>btn(I(i)+E(t),'coach-prompt',v,'prompt-button')).join('')}</div><form id="coach-form" class="coach-form"><input name="question" placeholder="Ex.: como está meu supino?" aria-label="Pergunta sobre seus registros" maxlength="300" required><button class="dark" type="submit">Analisar ${I('arrow')}</button></form>${coachResult?`<section class="card coach-response" id="coach-response">${coachResult}</section>`:`<div class="callout neutral mt">Comece por uma das perguntas acima. As respostas mostram o que foi registrado e os limites do que pode ser concluído.</div>`}</div><aside class="rail"><section class="card"><span class="eyebrow muted">SEU CONTEXTO</span><h3 style="margin:14px 0">${E(state.profile.goal)}</h3><p class="mini-note">${state.profile.weeklyGoal} dias por semana · ${E(state.profile.experience)}</p><p class="mini-note mt">Equipamentos informados: ${E(state.profile.equipment.join(', ')||'nenhum')}.</p>${state.profile.limitations?`<div class="callout orange mt">Você registrou limitações no perfil. Elas não são avaliadas automaticamente.</div>`:''}${btn('Editar meu contexto','go-profile','','outline small-button','style="margin-top:17px"')}</section><section class="card"><h3>Você continua no controle.</h3><p class="desc">Uma sugestão de progressão não altera a carga sozinha. Substituições são revisadas por você. Uma versão curta de uma ficha precisa ser salva antes de entrar na sua rotina.</p></section></aside></div>`}
function profile(){const p=state.profile;return `${heading('UM PLANO QUE CABE NA SUA ROTINA','Seu perfil, seu ponto de partida.','Ajuste objetivos e preferências para os seus próximos treinos.')}<div class="profile-layout"><div><form id="profile-form" class="card"><div class="card-title"><h3>Objetivo e rotina</h3><span class="pill">Preferências</span></div><div class="form-grid">${label('Como quer ser chamado?','name',p.name,'text','maxlength="100" placeholder="Seu nome"')}${select('Objetivo principal','goal',['Hipertrofia','Força','Condicionamento geral'],p.goal)}${select('Treinos por semana','weeklyGoal',[1,2,3,4,5,6,7].map(x=>[x,x+' dias']),p.weeklyGoal)}${select('Experiência informada','experience',['Iniciante','Intermediário','Avançado'],p.experience)}${select('Registro de esforço','effortMetric',[['RIR','RIR · repetições em reserva'],['RPE','RPE · esforço de 1 a 10']],p.effortMetric)}${label('Incremento padrão de carga (kg)','progressionIncrement',p.progressionIncrement,'number','min="0.25" max="100" step="0.25" required')}<div class="full"><label class="field">Equipamentos disponíveis</label><div class="check-grid">${['Halteres','Barra','Polia','Máquina','Peso corporal'].map(e=>`<label><input type="checkbox" name="equipment" value="${E(e)}" ${p.equipment.includes(e)?'checked':''}> ${E(e)}</label>`).join('')}</div></div><label class="field full">Limitações e orientações que deseja lembrar<textarea name="limitations" maxlength="1000" placeholder="Anote orientações recebidas, ajustes de equipamento…">${E(p.limitations)}</textarea></label>${label('Meta de cardio (minutos moderados equivalentes)','cardioTarget',p.cardioTarget,'number','min="0" max="1000" step="1" required')}</div><p class="mini-note mt">O incremento é uma preferência de registro, não uma indicação automática de aumento. Cada exercício pode ter seu próprio incremento na ficha.</p><div class="actions end mt"><button class="primary" type="submit">Salvar perfil</button></div></form><section class="card mt"><div class="card-title"><h3>Seus dados, com você</h3>${I('download')}</div><p class="mini-note">Exporte fichas, histórico, planejamento, cardio, medidas e associações de vídeo. Os arquivos de vídeo adicionados por você ficam no navegador; os vídeos incluídos acompanham o pacote do app.</p><div class="actions mt">${btn('Exportar backup','export','','outline')}${btn('Restaurar backup','restore','','outline')}${badStorage?btn('Exportar conteúdo preservado','export-recovery','','outline'):''}</div></section></div><aside class="rail"><section class="card"><h3>Avisos de descanso</h3><p class="desc">O cronômetro funciona no app. Se o navegador permitir, você pode ativar notificações e vibração.</p>${btn('Ativar notificações','notifications','','outline small-button','style="margin-top:17px"')}<p class="mini-note mt">${'Notification' in window?'Estado: '+({granted:'permitidas',denied:'bloqueadas nas preferências do navegador',default:'ainda não solicitadas'}[Notification.permission]):'Notificações não estão disponíveis neste navegador.'}</p></section><section class="card"><h3>O que está conectado?</h3><p class="desc">Você pode usar o Ritmo neste navegador ou entrar em uma conta para sincronizar seus treinos. Consulte o estado da conta acima. Health Connect e smartwatch ainda não estão integrados.</p></section><section class="card"><h3>Bases e limites</h3><p class="desc">A organização segue o ciclo planejar, executar, registrar e revisar. O Coach ajuda a organizar dados, sem substituir avaliação individual.</p><div class="small-list mt"><a href="https://acsm.org/resistance-training-guidelines-update-2026/" target="_blank" rel="noopener noreferrer">ACSM · treinamento resistido</a><a href="https://www.who.int/publications/i/item/9789240015128" target="_blank" rel="noopener noreferrer">OMS · atividade física</a></div></section></aside></div>`}
function render(){document.body.classList.toggle('body-session',!!state.session);for(const selector of ['#desktop-nav','#mobile-nav'])$(selector).innerHTML=NAV.map(([v,t])=>`<button class="nav-button ${current===v?'active':''}" data-nav="${v}" aria-current="${current===v?'page':'false'}">${I(v)}<span>${t}</span></button>`).join('');$('#breadcrumb').textContent=NAV.find(([v])=>v===current)?.[1]||'Seu espaço de treino';$('#top-date').textContent=new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});$('.avatar').textContent=state.profile.name.trim()?state.profile.name.trim()[0].toUpperCase():'R';$('#screen').innerHTML=({inicio:home,treino:training,progresso:progress,coach,perfil:profile}[current]||home)();updateRestDock();}
function start(planId){if(state.session){navigate('treino');toast('Seu treino em andamento foi retomado.');return}const plan=state.plans.find(p=>p.id===planId);if(!plan)return;state.session=D.startSession(state,plan);save();navigate('treino')}
function finish(){const s=state.session;if(!s)return;const done=s.exercises.reduce((n,e)=>n+e.sets.filter(x=>x.done).length,0),all=s.exercises.reduce((n,e)=>n+e.sets.length,0);if(!done)return;if(done<all&&!confirm(`Salvar esta sessão com ${done} de ${all} séries concluídas?`))return;const completed=D.normalizeCompleted(s);state.history.push(completed);state.session=null;state.rest=null;const persisted=save();progressTab='historico';navigate('progresso');toast(persisted?'Treino salvo. Seus registros já estão disponíveis para o próximo treino.':'Treino registrado nesta aba, mas não salvo no navegador. Exporte um backup.')}
function checkSet(value){const [i,j]=value.split(':').map(Number),exercise=state.session?.exercises[i],set=exercise?.sets[j];if(!set)return;if(!set.done&&(!Number.isInteger(set.reps)||set.reps<1)){toast('Registre pelo menos uma repetição antes de concluir a série.');return}set.done=!set.done;if(set.done)state.rest=exercise.rest>0&&exercise.sets[j+1]?.type!=='drop'?{end:Date.now()+exercise.rest*1000,remaining:exercise.rest,paused:false,name:exercise.name}:null;save();render()}
function remaining(){const r=state.rest;return !r?0:r.paused?r.remaining:Math.max(0,Math.ceil((r.end-Date.now())/1000))}
function timeString(s){return `${Math.floor(s/60).toString().padStart(2,'0')}:${Math.round(s%60).toString().padStart(2,'0')}`}
function updateRestDock(){const dock=$('#rest-dock'),r=state.rest;if(!r){dock.hidden=true;dock.replaceChildren();return}dock.hidden=false;if(!dock.querySelector('[data-rest-time]'))dock.innerHTML=`<div class="row"><div><div class="eyebrow" style="color:var(--lime);font-size:9px">DESCANSO ENTRE SÉRIES</div><div class="timer-caption" data-rest-name></div></div><div class="timer-digits" data-rest-time role="timer"></div></div><div class="timer-tools">${btn('Pausar','rest-pause','','')}${btn('+30 s','rest-add','','primary')}${btn('Pular descanso','rest-skip','','')}</div>`;dock.querySelector('[data-rest-name]').textContent=r.name;dock.querySelector('[data-rest-time]').textContent=timeString(remaining());dock.querySelector('[data-action="rest-pause"]').textContent=r.paused?'Continuar':'Pausar'}
function tick(){if(state.rest&&!state.rest.paused&&remaining()<=0){const name=state.rest.name;state.rest=null;save();updateRestDock();toast('Descanso concluído · '+name);try{navigator.vibrate?.([150,100,150]);if('Notification' in window&&Notification.permission==='granted')new Notification('Ritmo · descanso concluído',{body:name})}catch{}}else if(state.rest)updateRestDock()}
function setField(target){if(!state.session)return;const [i,j,field]=target.dataset.set.split(':'),set=state.session.exercises[i]?.sets[j];if(!set)return;const empty=target.value.trim()==='',value=Number(target.value),metric=state.session.exercises[i].metric||'RIR';const valid=field==='effort'?(empty||(Number.isFinite(value)&&value>=(metric==='RPE'?1:0)&&value<=10)):!empty&&Number.isFinite(value)&&value>=0&&(field==='weight'?value<=2000:Number.isInteger(value)&&value>=1&&value<=1000);if(!valid){target.value=set[field]??'';toast('Informe um valor válido para a série.');return}set[field]=field==='effort'&&empty?null:value;save()}

'use strict';
function openModal(title,html,wide=false){closeModal();const m=$('#modal');m.style.width=wide?'760px':'570px';m.innerHTML=`<div class="modal-heading"><h2 id="modal-title">${E(title)}</h2><button class="modal-close" data-action="close-modal" aria-label="Fechar janela">×</button></div><div class="modal-body">${html}</div>`;m.showModal();return m}
function closeModal(){const m=$('#modal');if(m.open)m.close();m.querySelectorAll('video').forEach(v=>{v.pause();v.removeAttribute('src');v.load()});if(modalCleanup){modalCleanup();modalCleanup=null}m.replaceChildren()}
$('#modal').addEventListener('close',()=>{if($('#modal').open)return;if(modalCleanup){modalCleanup();modalCleanup=null}$('#modal').querySelectorAll('video').forEach(v=>{v.pause();v.removeAttribute('src');v.load()});$('#modal').replaceChildren()});
function planEditor(planId){const p=state.plans.find(p=>p.id===planId);draft=p?D.clone(p):{id:D.id(),name:'',exercises:[]};drawPlanEditor()}
function drawPlanEditor(){const p=draft;openModal(p.name?'Editar ficha':'Nova ficha',`<form id="plan-form">${label('Nome da ficha','planName',p.name,'text','maxlength="100" required placeholder="Ex.: Upper A"')}<div id="plan-exercises">${p.exercises.map((e,i)=>`<section class="modal-exercise"><div class="row"><span class="name">${i+1}. ${E(e.name)}</span><div class="actions">${btn('↑','move-exercise',String(i),'ghost small-button',i?'aria-label="Mover exercício para cima"':'disabled aria-label="Mover exercício para cima"')}${btn('×','remove-exercise',String(i),'ghost small-button','aria-label="Remover '+E(e.name)+'"')}</div></div><div class="form-grid">${label('Séries','sets-'+i,e.sets,'number',`min="1" max="10" required data-draft="${i}:sets"`)}${label('Mín. repetições','min-'+i,e.repsMin,'number',`min="1" max="100" required data-draft="${i}:repsMin"`)}${label('Máx. repetições','max-'+i,e.repsMax,'number',`min="1" max="100" required data-draft="${i}:repsMax"`)}${label('Descanso (s)','rest-'+i,e.rest,'number',`min="0" max="900" step="5" required data-draft="${i}:rest"`)}${label('Incremento (kg)','increment-'+i,e.increment,'number',`min="0.25" max="100" step="0.25" required data-draft="${i}:increment"`)}${label('Observação','notes-'+i,e.notes,'text',`maxlength="1000" data-draft="${i}:notes"`)}</div></section>`).join('')}</div><div class="editor-add"><input id="add-exercise-name" list="exercise-names" placeholder="Buscar ou digitar um exercício" maxlength="100" aria-label="Exercício para adicionar"><datalist id="exercise-names">${D.CATALOG.map(e=>`<option value="${E(e.name)}">${E(e.primary)} · ${E(e.equipment)} · ${E(e.aliases.join(', '))}</option>`).join('')}</datalist>${btn('+ Adicionar','add-plan-exercise','','outline')}</div><p class="mini-note mt">Exercícios personalizados podem ser adicionados pelo nome. Faixas, descanso e incremento são configurados por você.</p><div class="modal-actions">${btn('Cancelar','close-modal','','outline')}<button class="primary" type="submit">Salvar ficha</button></div></form>`,true)}
function exerciseInfo(name){const e=D.info(name),video=videoMapping(name),alternatives=D.alternatives(state,name);openModal(name,`<div class="tag-row mb"><span class="pill">${E(e.primary)}</span><span class="pill outline">${E(e.equipment)}</span><span class="pill ${video?'lime':''}">${video?'Demonstração disponível':'Vídeo pendente'}</span></div><div class="library-detail"><div class="detail-line"><b>Grupo principal</b>${E(e.primary)}</div><div class="detail-line"><b>Grupos secundários</b>${E(e.secondary.join(', ')||'Não listados')}</div><div class="detail-line"><b>Execução e registro</b>${E(e.cue)}</div><div class="detail-line"><b>Ponto de atenção</b>${E(e.mistake)}</div><div class="detail-line"><b>Alternativas para revisar com seu equipamento</b>${alternatives.length?E(alternatives.map(x=>x.name).join(', ')):'Não há outra opção equivalente cadastrada para os equipamentos informados.'}</div></div><p class="mini-note mt">As alternativas coincidem em padrão de movimento e grupo principal. Equipamento, experiência, limitações e orientação individual precisam ser considerados na escolha.</p><div class="modal-actions">${btn(video?I('play')+' Ver execução':'+ Adicionar vídeo','video',name,'primary')}</div>`)}
function substitute(index){const e=state.session?.exercises[index];if(!e||e.sets.some(s=>s.done)){toast('Substitua o exercício antes de concluir suas séries.');return}const alternatives=D.alternatives(state,e.name);openModal('Substituir '+e.name,`<div class="callout neutral"><p>Mesmo padrão de movimento e grupo principal, com equipamento informado no seu perfil.</p><p>Seu contexto: ${E(state.profile.goal)} · ${E(state.profile.experience)}.</p></div>${state.profile.limitations?`<div class="callout orange mt">Limitações anotadas: ${E(state.profile.limitations)}. O app não avalia automaticamente se uma alternativa é adequada a essas condições.</div>`:''}<p class="mini-note mt">A troca vale somente para esta sessão. A carga não é transferida entre equipamentos; será usado o histórico do exercício escolhido, quando existir.</p>${alternatives.map(a=>`<div class="alternative"><div><h3>${E(a.name)}</h3><p>${E(a.equipment)} · ${E(a.primary)}</p></div>${btn('Escolher','choose-substitute',index+'|'+a.name,'primary small-button')}</div>`).join('')||empty('Nenhuma alternativa equivalente cadastrada para seu equipamento. Você pode revisar a ficha ou ampliar os equipamentos no perfil.')}`)}
function chooseSubstitute(value){const sep=value.indexOf('|'),index=+value.slice(0,sep),name=value.slice(sep+1),e=state.session?.exercises[index];if(!e||e.sets.some(s=>s.done)||!D.alternatives(state,e.name).some(x=>x.name===name))return;const previous=D.lastExercise(state,name);e.originalName=e.originalName||e.name;e.name=name;e.notes='';e.sets=e.sets.map((s,i)=>({weight:D.previousSet(previous,i,e.sets)?.weight||0,reps:e.repsMax,effort:null,done:false,type:s.type||'normal'}));save();closeModal();render();toast('Substituição aplicada somente a esta sessão.')}

function coachAnswer(topic,question=''){const s=D.weeklyStats(state);if(topic==='semana')coachResult=`<span class="eyebrow muted">UMA LEITURA DA SUA SEMANA</span><h2 style="margin-top:10px">${s.sessions} de ${state.profile.weeklyGoal} treinos registrados.</h2><p>Você concluiu ${N(s.volume)} kg de volume, distribuídos em ${Object.keys(s.groups).length} grupos principais. A consistência atual é ${N(s.consistency)}% da sua meta.</p><p>${s.sessions>=state.profile.weeklyGoal?'Sua meta de frequência foi alcançada.':`Faltam ${Math.max(0,state.profile.weeklyGoal-s.sessions)} sessões para a meta informada.`} Esses números descrevem os registros; não determinam o que você deve treinar hoje.</p>${btn('Revisar planejamento','schedule','','outline small-button')}`;
 else if(topic==='volume'){const rows=Object.entries(s.groups).sort((a,b)=>b[1]-a[1]);coachResult=`<span class="eyebrow muted">DISTRIBUIÇÃO DE SÉRIES</span><h2 style="margin:10px 0 20px">${rows.length?'Seu mapa desta semana.':'Ainda falta uma linha de base.'}</h2>${muscleMap()}<p>Uma diferença entre grupos não prova excesso ou falta de treino. O contexto do objetivo, exercícios, recuperação e orientação individual não é determinado por esta contagem.</p>`}
 else if(topic==='progressao'){const rows=state.plans.flatMap(p=>p.exercises.map(e=>({e,s:D.progression(state,e)}))).filter((x,i,all)=>all.findIndex(y=>y.e.name===x.e.name)===i);coachResult=`<span class="eyebrow muted">PROGRESSÃO DUPLA · REGRA LOCAL</span><h2 style="margin:10px 0 20px">A carga muda com sua revisão.</h2>${rows.map(({e,s})=>`<div class="insight"><h3>${E(e.name)}${s.eligible?' · sugestão '+N(s.weight)+' kg':''}</h3><p>${E(s.reason)}</p></div>`).join('')}<p>RIR/RPE é guardado para sua análise e não altera automaticamente essa regra. Aplique uma sugestão na tela de treino somente se ela fizer sentido para a sua sessão.</p>`}
 else if(topic==='curto'){shortForm();return}
 else{const q=question.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(),names=[...new Set(state.history.flatMap(h=>h.exercises.map(e=>e.name)))],name=names.find(n=>q.includes(n.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()))||names.find(n=>q.includes(n.split(' ')[0].toLowerCase()));if(name){const sessions=state.history.slice().sort((a,b)=>a.ended-b.ended).flatMap(h=>h.exercises.filter(e=>e.name===name&&e.sets.some(s=>s.done)).map(e=>({time:h.ended,weight:Math.max(...e.sets.filter(s=>s.done).map(s=>s.weight)),volume:D.volume({exercises:[e]})}))).slice(-3);coachResult=`<span class="eyebrow muted">REGISTROS DE ${E(name)}</span><h2 style="margin:10px 0 15px">O que seu histórico mostra.</h2>${sessions.map(r=>`<div class="insight"><h3>${date(r.time)} · maior carga ${N(r.weight)} kg</h3><p>${N(r.volume)} kg de volume nas séries concluídas.</p></div>`).join('')}<p>Comparar carga máxima isoladamente não explica uma possível estagnação. Estes registros não determinam causas como recuperação, alimentação ou técnica. Revise também repetições, esforço e observações.</p>`}else{if(q.includes('semana')||q.includes('frequencia'))return coachAnswer('semana');if(q.includes('volume')||q.includes('peito')||q.includes('muscul'))return coachAnswer('volume');if(q.includes('carga')||q.includes('progred'))return coachAnswer('progressao');if(q.includes('minuto')||q.includes('viaj')||q.includes('halter'))return shortForm();coachResult='<h3>Posso ler seus registros com regras locais.</h3><p>Use uma das perguntas sugeridas, ou mencione o nome de um exercício que já esteja no seu histórico. Não há um modelo de IA conectado nesta versão.</p>'}}

'use strict';
const TYPE_NAMES={normal:'Normal',warmup:'Aquecimento',drop:'Drop set',failure:'Até a falha'};
const TYPE_MARKS={normal:'',warmup:'W',drop:'D',failure:'F'};
let routineFolder='all',routineQuery='',historyDay='',calendarMonth=new Date(new Date().getFullYear(),new Date().getMonth(),1);
function workCount(session){return session.exercises.reduce((n,e)=>n+e.sets.filter(D.working).length,0)}
function typeMark(type,index){return TYPE_MARKS[type]||String(index+1)}
function getHistory(id){return state.history.find(h=>h.id===id)}
function themeApply(){document.documentElement.dataset.theme=state.profile.theme||'light';const meta=document.querySelector('meta[name="theme-color"]');if(meta)meta.content=state.profile.theme==='dark'?'#101721':'#ffffff'}
function elapsed(){const sec=state.session?Math.max(0,Math.floor((Date.now()-state.session.started)/1000)):0;return `${Math.floor(sec/60).toString().padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`}

function calendarCard(){const year=calendarMonth.getFullYear(),month=calendarMonth.getMonth(),first=new Date(year,month,1),offset=(first.getDay()+6)%7,total=new Date(year,month+1,0).getDate();const counts={};state.history.forEach(h=>{const key=D.dayKey(h.ended);counts[key]=(counts[key]||0)+1});const monthTotal=state.history.filter(h=>new Date(h.ended).getFullYear()===year&&new Date(h.ended).getMonth()===month).length;return `<section class="card calendar-card"><div class="card-title"><h3>Calendário de treinos</h3>${I('calendar')}</div><div class="calendar-month"><button data-action="calendar-prev" aria-label="Mês anterior">‹</button><strong>${E(calendarMonth.toLocaleDateString('pt-BR',{month:'long',year:'numeric'}))}</strong><button data-action="calendar-next" aria-label="Próximo mês">›</button></div><div class="month-grid">${['S','T','Q','Q','S','S','D'].map(d=>`<span class="month-weekday">${d}</span>`).join('')}${Array.from({length:offset},()=>'<span></span>').join('')}${Array.from({length:total},(_,i)=>{const time=new Date(year,month,i+1).getTime(),key=D.dayKey(time),n=counts[key]||0;return `<button class="month-day ${n?'trained':''} ${key===D.dayKey(Date.now())?'today':''}" data-action="calendar-day" data-value="${key}" aria-label="${stamp(time)}: ${n} treino${n===1?'':'s'}">${i+1}${n?'<i></i>':''}</button>`}).join('')}</div><p class="mini-note">${monthTotal} treino${monthTotal===1?'':'s'} registrado${monthTotal===1?'':'s'} neste mês</p></section>`}
function routinePreview(p,i=0){const last=state.history.filter(h=>h.planId===p.id).sort((a,b)=>b.ended-a.ended)[0];return `<article class="card routine-card"><div class="row"><div class="routine-symbol">${I('treino')}</div>${btn('···','routine-menu',p.id,'ghost routine-menu',`aria-label="Opções de ${E(p.name)}"`)}</div><h3>${E(p.name)}</h3><p class="routine-subtitle">${p.exercises.length} exercícios · ~${plannedMinutes(p)} min</p><div class="routine-lines">${p.exercises.slice(0,4).map(e=>`<div><span>${E(e.name)}</span><small>${e.sets} séries</small></div>`).join('')}${p.exercises.length>4?`<span class="mini-note">+${p.exercises.length-4} exercício(s)</span>`:''}</div><p class="routine-last">${I('clock')} ${last?'Último: '+date(last.ended):'Ainda não realizada'}</p>${btn('Iniciar rotina','start',p.id,'primary routine-start')}</article>`}
function activityCard(h,compact=false){const records=h.exercises.filter(e=>D.records(state,e.name).events.some(r=>r.ended===h.ended)),preview=h.exercises.filter(e=>e.sets.some(s=>s.done)).slice(0,compact?2:3);return `<article class="card activity-card"><div class="activity-user"><span class="activity-avatar">${E((state.profile.name||'R')[0].toUpperCase())}</span><div><b>${E(state.profile.name||'Seu treino')}</b><p>${E(stamp(h.ended))} às ${new Date(h.ended).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</p></div>${records.length?`<span class="badge-pr">★ ${records.length} PR${records.length>1?'s':''}</span>`:''}</div><h3>${E(h.name)}</h3><div class="activity-metrics"><span>${I('clock')} ${h.minutes} min</span><span>${I('treino')} ${N(D.volume(h))} kg</span><span>${I('check')} ${workCount(h)} séries de trabalho</span></div><div class="activity-preview"><div class="activity-preview-label"><span>Exercício</span><span>Melhor carga registrada</span></div>${preview.map(e=>{const rows=e.sets.filter(D.working),best=rows.slice().sort((a,b)=>b.weight-a.weight||b.reps-a.reps)[0];return `<div class="activity-exercise"><span><i>${I('treino')}</i>${E(e.name)}</span><b>${best?N(best.weight)+' kg × '+best.reps:'Aquecimento'}</b></div>`}).join('')}${h.exercises.length>preview.length?`<p class="mini-note">+${h.exercises.length-preview.length} exercício(s)</p>`:''}</div><div class="activity-footer">${btn('Ver treino','history-detail',h.id,'ghost small-button')}${btn('Repetir treino','repeat-history',h.id,'outline small-button')}</div></article>`}
home=function(){const next=D.nextPlan(state),stats=D.weeklyStats(state),recent=state.history.slice().sort((a,b)=>b.ended-a.ended).slice(0,3),all=state.history.length;return `${heading('SEU ESPAÇO DE TREINO',state.profile.name?'Olá, '+state.profile.name.split(' ')[0]+'.':'Visão geral','Acompanhe seus treinos e escolha o próximo passo.',btn(I('plus')+' Treino livre','empty-workout','','primary'))}${statsCards()}<div class="main-grid"><div><section class="today-hero"><div><span class="eyebrow">${state.session?'CONTINUE SEU TREINO':'PRONTO PARA TREINAR?'}</span><h2>${E(state.session?.name||next?.name||'Crie sua primeira rotina')}</h2><p>${state.session?'Seu treino está salvo e pode ser retomado.':next?`${next.exercises.length} exercícios · ${next.exercises.reduce((n,e)=>n+e.sets,0)} séries planejadas`:'Organize seus exercícios em uma rotina reutilizável.'}</p></div><div class="actions">${state.session?btn('Retomar treino','resume','','primary'):next?btn('Iniciar treino','start',next.id,'primary'):btn('Nova rotina','new-plan','','primary')}${btn('Ver rotinas','show-plans','','outline')}</div></section><div class="section-heading"><h2>Minhas rotinas</h2>${btn('Ver todas','show-plans','','ghost small-button')}</div><div class="routine-grid home-routines">${state.plans.slice(0,2).map(routinePreview).join('')||empty('Crie uma rotina para começar.')}</div><div class="section-heading"><h2>Atividade recente</h2><span class="pill">Seu histórico pessoal</span></div>${recent.length?`<div class="stack">${recent.map(h=>activityCard(h,true)).join('')}</div>`:`<section class="card empty-activity"><div class="empty-icon">${I('treino')}</div><h3>Seu próximo treino começa aqui</h3><p>Quando concluir uma sessão, ela aparecerá no seu histórico com séries, cargas e recordes.</p>${btn('Explorar rotinas','show-plans','','outline')}</section>`}</div><aside class="rail">${calendarCard()}<section class="card"><div class="card-title"><h3>Seu resumo</h3>${I('progresso')}</div><div class="summary-line"><span>Treinos registrados</span><strong>${all}</strong></div><div class="summary-line"><span>Meta semanal</span><strong>${stats.sessions} / ${state.profile.weeklyGoal}</strong></div><div class="summary-line"><span>Objetivo</span><strong>${E(state.profile.goal)}</strong></div><div class="progress-track mt"><span style="width:${stats.consistency}%"></span></div><p class="mini-note mt">${Math.max(0,state.profile.weeklyGoal-stats.sessions)} treino(s) para atingir a meta atual da semana.</p></section><section class="card"><div class="card-title"><h3>Distribuição da semana</h3>${I('target')}</div>${muscleMap()}</section><section class="card"><h3>Explore seus exercícios</h3><p class="desc">${Object.keys(window.RITMO_VIDEO_LIBRARY||{}).length} demonstrações incluídas e 1 referência adicional, com reprodução dentro do app.</p>${btn('Abrir biblioteca','show-library','','outline small-button','style="margin-top:15px"')}</section></aside></div>`};
training=function(){if(state.session)return workout();return `${heading('BIBLIOTECA DE TREINOS','Suas rotinas','Organize, personalize e registre cada sessão.',btn('Treino livre','empty-workout','','outline')+btn(I('plus')+' Nova rotina','new-plan','','primary'))}<div class="subtabs">${[['fichas','Minhas rotinas'],['biblioteca','Exercícios'],['semana','Planejamento']].map(([v,t])=>btn(t,'training-tab',v,trainingTab===v?'active':'')).join('')}</div>${trainingTab==='biblioteca'?libraryView():trainingTab==='semana'?scheduleView():plansView()}`};
plansView=function(){const query=routineQuery.toLocaleLowerCase('pt-BR'),filtered=state.plans.filter(p=>(routineFolder==='all'||(routineFolder==='unfiled'?!p.folderId:p.folderId===routineFolder))&&(!query||p.name.toLocaleLowerCase('pt-BR').includes(query)));return `<div class="routine-toolbar"><div class="folder-tabs">${btn('Todas ('+state.plans.length+')','folder-filter','all',routineFolder==='all'?'folder active':'folder')}${(state.folders||[]).map(f=>btn(I('library')+E(f.name),'folder-filter',f.id,routineFolder===f.id?'folder active':'folder')).join('')}${btn('Sem pasta','folder-filter','unfiled',routineFolder==='unfiled'?'folder active':'folder')}</div><div class="actions">${btn('+ Pasta','new-folder','','outline small-button')}${btn('Gerenciar','manage-folders','','ghost small-button')}</div></div><div class="routine-search"><input id="routine-search" aria-label="Buscar rotina" placeholder="Buscar rotina…" value="${E(routineQuery)}"></div><div class="routine-grid">${filtered.map((p,i)=>`<div>${routinePreview(p,i)}<label class="routine-folder-label">Pasta <select data-routine-folder="${E(p.id)}" aria-label="Pasta de ${E(p.name)}">${options([['','Sem pasta'],...(state.folders||[]).map(f=>[f.id,f.name])],p.folderId||'')}</select></label></div>`).join('')||empty('Nenhuma rotina nesta seleção. Crie uma rotina ou altere o filtro.')}</div><p class="mini-note mt">Rotinas são modelos reutilizáveis. Alterar uma rotina não modifica seus treinos anteriores.</p>`};
const priorWorkout=workout;
workout=function(){const s=state.session,done=s.exercises.reduce((n,e)=>n+e.sets.filter(x=>x.done).length,0),total=s.exercises.reduce((n,e)=>n+e.sets.length,0);return `<div class="live-page-heading"><div><span class="eyebrow muted">TREINO EM ANDAMENTO</span><div class="live-name"><h1>${E(s.name)}</h1>${btn('✎','rename-session','','ghost',`aria-label="Renomear treino"`)}</div></div>${btn('Descartar','discard','','ghost small-button')}</div><section class="session-summary"><div class="session-numbers"><div><span>Duração</span><strong data-session-elapsed>${elapsed()}</strong></div><div><span>Volume de trabalho</span><strong>${N(D.volume(s))}<small> kg</small></strong></div><div><span>Séries concluídas</span><strong>${done}<small> / ${total}</small></strong></div></div>${btn('Concluir treino ✓','finish','','primary',done?'':'disabled')}<div class="progress-track"><span style="width:${total?done/total*100:0}%"></span></div></section><div class="main-grid workout-grid"><div>${s.exercises.map((e,i)=>exerciseCard(e,i)).join('')||`<div class="card empty-activity"><div class="empty-icon">${I('plus')}</div><h3>Monte este treino enquanto treina</h3><p>Adicione um exercício da biblioteca ou um exercício personalizado.</p></div>`}<div class="live-add-bar">${btn(I('plus')+' Adicionar exercício','add-live-exercise','','outline')}</div><p class="mini-note mt">O volume de trabalho e os recordes excluem aquecimentos. O tipo de série é um registro escolhido por você.</p></div><aside class="rail"><section class="card"><div class="card-title"><h3>O registro, sem complicação</h3>${I('check')}</div><div class="small-list"><p class="mini-note">Toque na coluna <b>Anterior</b> para copiar carga e repetições de uma série correspondente.</p><p class="mini-note">Toque no número da série para marcar aquecimento, normal, drop ou falha.</p><p class="mini-note">Os ajustes desta sessão não mudam sua rotina original.</p></div></section><section class="card"><h3>Tipos de série</h3><div class="set-type-legend"><span><i class="type-warmup">W</i> Aquecimento</span><span><i class="type-normal">1</i> Normal</span><span><i class="type-drop">D</i> Drop set</span><span><i class="type-failure">F</i> Até a falha</span></div><p class="mini-note">São etiquetas para registrar o que foi feito. RIR/RPE é informado separadamente.</p></section><section class="card"><h3>Seu foco</h3><p class="desc">${E(state.profile.goal)} · ${E(state.profile.effortMetric)} por série</p><p class="mini-note mt">Aquecimentos não entram na progressão automática. Sessões com drop sets ou séries até a falha ficam para revisão individual.</p></section></aside></div>`};
const priorExerciseCard=exerciseCard;
exerciseCard=function(e,i){const t=document.createElement('template');t.innerHTML=priorExerciseCard(e,i);const card=t.content.firstElementChild,previous=D.lastExercise(state,e.name),heading=card.querySelector('.exercise-heading');heading.innerHTML=`<div class="exercise-identity"><span class="exercise-symbol">${I('treino')}</span><div><h3>${E(e.name)}</h3><p class="group">${E(D.info(e.name).primary)} · ${E(D.info(e.name).equipment)}${e.originalName?' · Substitui '+E(e.originalName):''}</p></div></div>${btn('···','exercise-menu',String(i),'ghost',`aria-label="Opções de ${E(e.name)}"`)}`;const actions=card.querySelector('.exercise-actions');const oldDetail=actions.querySelector('[data-action="exercise-info"]');if(oldDetail){oldDetail.dataset.action='exercise-history';oldDetail.innerHTML=I('clock')+' Histórico'}card.querySelector('.set-labels').firstElementChild.textContent='Série';card.querySelectorAll('.set-row').forEach((row,j)=>{const set=e.sets[j],type=set.type||'normal';row.querySelector('.set-number').innerHTML=btn(typeMark(type,j),'set-options',i+':'+j,'set-type type-'+type,`aria-label="Tipo da série ${j+1} de ${E(e.name)}" title="${E(TYPE_NAMES[type])}"`);const p=D.previousSet(previous,j,e.sets);if(p)row.querySelector('.previous').innerHTML=btn(N(p.weight)+' × '+p.reps,'copy-previous',i+':'+j,'previous-button',`aria-label="Copiar série anterior ${j+1} de ${E(e.name)}"`)});const add=document.createElement('div');add.className='add-set-row';add.innerHTML=btn('+ Adicionar série','add-live-set',String(i),'add-set-button');const last=card.querySelector('.set-row:last-of-type');const rows=card.querySelectorAll('.set-row');if(rows.length)rows[rows.length-1].after(add);else card.querySelector('.set-labels').after(add);card.querySelector('.exercise-tip')?.remove();return card.outerHTML};

  if(/OTP|TOKEN.*EXPIRED|INVALID_TOKEN/.test(code))return 'Código inválido ou expirado. Solicite um novo código.';
  if(status===429||/RATE_LIMIT|TOO_MANY/.test(code))return 'Muitas tentativas. Aguarde alguns minutos e tente novamente.';
  if(/EMAIL.*SEND|SEND.*EMAIL|SMTP/.test(code))return 'Não foi possível enviar o e-mail. O provedor de e-mail do Neon precisa ser verificado.';
  const reference=[stage.toUpperCase().replace(/[^A-Z_-]/g,''),code,status||''].filter(Boolean).join(' / ');
  if(error?.name==='TypeError'||error?.name==='TimeoutError'||error?.name==='AbortError')return 'O navegador não conseguiu se comunicar com o login. Tente outra rede ou navegador. Referência: '+reference;
  return (status>=500?'O serviço de autenticação não conseguiu concluir a operação.':'Não foi possível concluir esta etapa do acesso.')+' Referência: '+reference;
}
return {details,message,needsVerification};
});

(function(){
'use strict';
const base=new URL(document.documentElement.dataset.pwaBase||'./',location.href);
let client=null,user=null,available=false,checking=true,verified=false,timer=null,authBusy=false,authGeneration=0;
let message='Verificando disponibilidade da conta…';
const originalSave=save,originalRender=render;
const store=new RitmoCloudStore.Store({storage:localStorage,initial:()=>D.initial(),validate:x=>D.validate(x),request,
  onData(payload){state=payload;badStorage=null;draft=null;coachResult='';window.shortDraft=null;chartExercise=state.history.at(-1)?.exercises[0]?.name||'Supino com halteres';render()},
  onStatus(value){message=value;mount()}
});
function sessionResult(result){if(result?.error)throw result.error;return result?.data?.user||null}
function restoreGuest(){
  const raw=localStorage.getItem(KEY);badStorage=null;
  try{state=raw?D.validate(JSON.parse(raw)):D.initial()}catch{badStorage=raw;state=D.initial()}
  draft=null;coachResult='';window.shortDraft=null;
}
function schedule(){clearTimeout(timer);timer=setTimeout(()=>{if(verified)store.sync()},1200)}
save=function(){
  if(!store.owner)return originalSave();
  try{store.save(state);storageWorking=true;schedule();return true}
  catch{storageWorking=false;$('#storage-banner').hidden=false;$('#storage-banner').textContent='Não foi possível salvar nesta conta. Exporte seu backup antes de sair ou recarregar.';toast('Exporte seu backup para preservar as alterações.');return false}
};
render=function(){originalRender();mount()};
function button(text,action,disabled=false){return `<button type="button" class="outline small-button" data-cloud="${action}" ${disabled?'disabled':''}>${text}</button>`}
function mount(){
  document.querySelectorAll('[data-cloud-card]').forEach(el=>el.remove());
  const label=document.querySelector('.local-label');if(label)label.textContent=store.owner?'Conta · '+(store.record.dirty?'envio pendente':'cópia neste aparelho'):'Dados neste navegador';
  const footer=document.querySelector('.app-footer span');if(footer)footer.textContent=store.owner?'Ritmo · '+message:'Ritmo · dados salvos neste navegador';
  if(current!=='perfil'&&current!=='inicio')return;
  const card=document.createElement('section');card.className='card cloud-card';card.dataset.cloudCard='';
  card.innerHTML=`<div class="card-title"><h3>${user?'Sua conta Ritmo':'Seus treinos em todos os aparelhos'}</h3><span class="pill">${store.owner?'Conta':'Acesso opcional'}</span></div><p class="mini-note" role="status">${E(message)}</p>${user?`<p class="mini-note">${E(user.email||user.name||'Conta conectada')}</p><div class="actions mt">${!verified&&available?button('Entrar novamente','login',authBusy):''}${button('Sincronizar agora','sync',!verified||store.busy||store.blocked)}${button('Importar dados deste navegador','import',!verified||store.blocked)}${button('Exportar cópias de recuperação','recoveries')}${button('Sair da conta','logout',authBusy||!client)}</div>${store.blocked?`<div class="callout orange mt"><p>As versões não foram sobrescritas. Exporte seu backup antes de escolher.</p><div class="actions mt">${button('Usar versão da nuvem','remote')}${button('Enviar versão deste aparelho','local')}${button('Exportar minha cópia','export')}</div></div>`:''}<p class="mini-note mt">Arquivos de vídeo pessoais ficam neste aparelho. Os vídeos incluídos continuam disponíveis no app.</p>`:available?`<div class="actions mt">${button('Entrar','login',authBusy)}${button('Criar conta','signup',authBusy)}</div><p class="mini-note mt">Os dados atuais só serão enviados se você escolher importá-los após entrar.</p>`:!checking?'<p class="mini-note mt">Você pode continuar usando o app e exportando seus backups neste navegador.</p>':''}`;
  $('#screen').prepend(card);
}
async function request(method,body,owner){
  if(!client||!verified||user?.id!==owner)throw Object.assign(Error('auth'),{status:401});
  const result=await client.token();if(result.error||!result.data?.token)throw Object.assign(Error('auth'),{status:401});
  if(user?.id!==owner||!verified)throw Object.assign(Error('auth'),{status:401});
  const response=await fetch(new URL('api/account',base),{method,cache:'no-store',headers:{Authorization:'Bearer '+result.data.token,...(body?{'Content-Type':'application/json'}:{})},...(body?{body:JSON.stringify(body)}:{}),signal:AbortSignal.timeout(20000)});
  if(!response.ok)throw Object.assign(Error('cloud'),{status:response.status});return response.json();
}
async function attach(next){
  if(store.owner===next.id){user=next;verified=true;await store.sync();return}
  if(state.session){message='Conclua ou descarte o treino atual antes de entrar em outra conta.';mount();return}
  if(!save())throw Error('storage');
  closeModal();store.detach();user=next;verified=true;
  try{store.activate(next.id);localStorage.setItem('ritmo-account-active',next.id)}
  catch{store.detach();verified=false;user=null;restoreGuest();message='Não foi possível abrir a cópia desta conta. Ela foi preservada; exporte os dados antes de continuar.';render();return}
  await store.sync();
}
function authForm(mode,email=''){
  const verify=mode==='verify',reset=mode.startsWith('reset'),signup=mode==='signup';
  openModal(verify?'Verificar e-mail':reset?'Recuperar acesso':signup?'Criar conta Ritmo':'Entrar no Ritmo',`<form id="cloud-auth-form" data-mode="${mode}">${signup?label('Nome','name','','text','autocomplete="name" maxlength="100" required'):''}${label('E-mail','email',email,'email','autocomplete="email" required maxlength="254"')}${verify?label('Código recebido por e-mail','code','','text','inputmode="numeric" autocomplete="one-time-code" required minlength="4" maxlength="12"'):(!reset||mode==='reset-confirm')?label('Senha','password','','password',`autocomplete="${signup||reset?'new-password':'current-password'}" required minlength="8" maxlength="128"`):''}${mode==='reset-confirm'?label('Código recebido','code','','text','inputmode="numeric" autocomplete="one-time-code" required minlength="4" maxlength="12"'):reset?'<p class="mini-note mt">Enviaremos um código de recuperação por e-mail.</p>':''}<p id="cloud-auth-message" class="mini-note mt" role="status"></p><div class="actions mt"><button class="primary" type="submit">${verify?'Confirmar código':reset?(mode==='reset-confirm'?'Salvar nova senha':'Enviar código'):signup?'Criar conta':'Entrar'}</button>${verify?button('Reenviar código','resend'):!signup&&!reset?button('Esqueci minha senha','reset'):''}</div></form>`);
}
async function checkSession(){
  if(!client||authBusy)return;
  const generation=authGeneration;
  try{
    const next=sessionResult(await client.getSession());if(generation!==authGeneration)return;
    if(next)await attach(next);
    else if(user){verified=false;message='Sessão encerrada. Entre novamente para sincronizar; seus dados estão neste aparelho.';mount()}
  }catch{if(store.owner){verified=false;message='Sem conexão para verificar a sessão. Dados desta conta preservados neste aparelho.';mount()}}
}
document.addEventListener('submit',async event=>{
  const form=event.target;if(form.id!=='cloud-auth-form')return;event.preventDefault();if(authBusy||!form.reportValidity())return;
  authBusy=true;authGeneration++;const submit=form.querySelector('[type="submit"]');submit.disabled=true;
  const data=new FormData(form),email=String(data.get('email')).trim(),password=String(data.get('password')||''),code=String(data.get('code')||'').trim(),mode=form.dataset.mode;
  const status=form.querySelector('#cloud-auth-message');status.textContent='Aguarde…';
  let stage=mode,created=false;
  try{
    let result;
    if(mode==='verify')result=await client.emailOtp.verifyEmail({email,otp:code});
    else if(mode.startsWith('reset'))result=mode==='reset-confirm'?await client.emailOtp.resetPassword({email,otp:code,password}):await client.forgetPassword.emailOtp({email});
    else result=mode==='signup'?await client.signUp.email({email,password,name:String(data.get('name')).trim()}):await client.signIn.email({email,password});
    if(result.error){if(RitmoAuthErrors.needsVerification(result.error)){authForm('verify',email);return}throw result.error}
    created=mode==='signup'&&!!result.data?.user;
    if(mode.startsWith('reset')){if(mode==='reset-confirm'){authForm('login',email);toast('Senha atualizada. Entre com a nova senha.')}else{authForm('reset-confirm',email);$('#cloud-auth-message').textContent='Se houver uma conta, o código será enviado ao e-mail informado.'}return}
    stage='session';const next=sessionResult(await client.getSession());
    if(next){await attach(next);toast('Conta conectada. Seus dados anteriores continuam separados neste navegador.')}
    else if(mode==='signup'){
      if(result.data?.token||result.data?.session){authForm('login',email);$('#cloud-auth-message').textContent='Conta criada. Entre para continuar. Se a sessão não permanecer aberta, confira as permissões de cookies do navegador.'}
      else authForm('verify',email);
    }
    else {authForm('login',email);toast('E-mail confirmado. Entre para continuar.')}
  }catch(error){
    if(RitmoAuthErrors.needsVerification(error)){authForm('verify',email)}
    else if(created){authForm('login',email);$('#cloud-auth-message').textContent='Conta criada, mas não foi possível iniciar a sessão. '+RitmoAuthErrors.message(error,stage)}
    else if(status.isConnected)status.textContent=RitmoAuthErrors.message(error,stage);
  }
  finally{authBusy=false;if(submit.isConnected)submit.disabled=false;mount()}
});
document.addEventListener('click',async event=>{
  const target=event.target.closest('[data-cloud]');if(!target||target.disabled)return;event.preventDefault();const action=target.dataset.cloud;
  if(['login','signup','reset'].includes(action)){
    if(state.session&&action!=='reset'){toast('Conclua ou descarte o treino antes de entrar na conta.');return}
    authForm(action);return;
  }
  if(action==='export'){exportData();return}
  if(action==='recoveries'){
    const copies=[];
    for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i);if(key?.startsWith(store.key+':recovery:')||key?.startsWith(store.key+':before-import:'))copies.push({key,data:JSON.parse(localStorage.getItem(key))})}
    if(!copies.length){toast('Não há cópias de recuperação desta conta neste aparelho.');return}
    const url=URL.createObjectURL(new Blob([JSON.stringify(copies,null,2)],{type:'application/json'})),link=document.createElement('a');link.href=url;link.download='ritmo-recuperacao.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);return;
  }
  if(action==='resend'){
    if(authBusy)return;target.disabled=true;
    try{const email=$('#cloud-auth-form [name="email"]').value;const result=await client.emailOtp.sendVerificationOtp({email,type:'email-verification'});if(result.error)throw result.error;$('#cloud-auth-message').textContent='Código enviado. Confira seu e-mail.'}catch{toast('Não foi possível reenviar o código. Tente novamente mais tarde.')}finally{if(target.isConnected)target.disabled=false}return;
  }
  if(authBusy)return;
  if(['logout','import','remote','local'].includes(action)&&state.session){toast('Conclua ou descarte o treino antes de trocar os dados da conta.');return}
  target.disabled=true;
  try{
    if(action==='sync'){await checkSession();await store.sync()}
    if(action==='logout'){
      if(store.record?.dirty&&!confirm('Há alterações que ainda não foram enviadas. Elas ficarão neste aparelho, vinculadas à conta. Sair mesmo assim?'))return;
      authBusy=true;authGeneration++;const result=await client.signOut();if(result.error)throw result.error;
      store.detach();clearTimeout(timer);verified=false;user=null;localStorage.removeItem('ritmo-account-active');
      restoreGuest();closeModal();message='Você está usando os dados locais deste navegador.';render();
    }
    if(action==='import'){
      const raw=localStorage.getItem(KEY);if(!raw){toast('Não há dados locais anteriores para importar.');return}
      if(!confirm('Substituir os dados desta conta pelos dados locais anteriores? Uma cópia de segurança da conta será preservada neste aparelho.'))return;
      const incoming=D.validate(JSON.parse(raw));if(incoming.session){toast('Conclua o treino dos dados locais antes de importar.');return}
      localStorage.setItem(store.key+':before-import:'+Date.now(),JSON.stringify(store.record));store.save(incoming);state=incoming;render();await store.sync();
    }
    if(action==='remote'||action==='local'){
      if(!confirm(action==='remote'?'Usar os dados da nuvem neste aparelho? As duas versões serão preservadas em uma cópia de recuperação local.':'Substituir a versão da nuvem pelos dados deste aparelho? As duas versões serão preservadas em uma cópia de recuperação local.'))return;
      await store.resolve(action==='remote');render();
    }
  }catch{toast('Não foi possível concluir. Os dados locais foram preservados.')}
  finally{authBusy=false;mount()}
});
async function boot(){
  if(location.protocol==='file:'||location.hostname.endsWith('github.io')){checking=false;message='Acesso local. Para entrar na conta, abra o Ritmo hospedado na Vercel.';mount();return}
  // Restore only a previously selected account cache; no network upload before session verification.
  try{const owner=localStorage.getItem('ritmo-account-active');if(owner&&localStorage.getItem('ritmo-account:'+owner)&&!state.session){store.activate(owner);user={id:owner};verified=false}}catch{store.detach();user=null;verified=false;restoreGuest();message='Não foi possível ler a cópia da conta. Os dados foram preservados.'}
  try{
    const response=await fetch(new URL('api/config',base),{cache:'no-store',signal:AbortSignal.timeout(10000)});
    if(!response.ok)throw Error('config');const config=await response.json();if(!config.enabled||!config.authUrl)throw Error('config');
    const sdk=await import(new URL('assets/neon-auth.js',base).href);
    client=sdk.createAuthClient(config.authUrl,{adapter:sdk.BetterAuthVanillaAdapter({fetchOptions:{credentials:'include'}})});
    available=true;message='Entre para salvar e acessar seus treinos em outros aparelhos.';await checkSession();
  }catch{message=store.owner?'Sem conexão com a conta. Seus dados continuam disponíveis neste aparelho.':'Conta indisponível agora. Seus treinos continuam salvos neste navegador.'}
  finally{checking=false;mount()}
}
window.addEventListener('online',()=>{if(client)checkSession();else boot()});
window.addEventListener('focus',()=>{if(client)checkSession()});
window.addEventListener('storage',event=>{if(store.owner&&event.key===store.key&&event.newValue!==store.disk){store.blocked=true;store.status('Outro separador alterou estes dados. Exporte sua cópia antes de recarregar.')}});
setInterval(()=>{if(verified)store.sync()},30000);
mount();boot();
})();
</script></body></html>
